# Example configuration for job_search_agent
# Copy to config.yaml to customize.

companies:
  - name: "Acme AI"
    ats: "greenhouse"
    board_id: "acme-ai"
  - name: "Nordic Data"
    ats: "lever"
    board_id: "nordic-data"

collectors:
  company_boards:
    request_delay: 1.5
    cooldown_hours: 12

filter:
  location:
    allowed_countries_and_cities:
      - "poland"
      - "polska"
      - "pl"
      - "warszawa"
      - "warsaw"
      - "krakow"
      - "kraków"
      - "wroclaw"
      - "wrocław"
      - "poznan"
      - "poznań"
      - "gdansk"
      - "gdańsk"
      - "remote"
      - "zdalnie"
      - "eu"
      - "europe"
      - "europa"
    allow_any_remote: true

  work_type:
    allowed:
      - "b2b"
      - "employment"
      - "permanent"
      - "uop"
      - "contract"
      - "freelance"
    allow_missing: true

  exclude:
    titles:
      - "lead"
      - "principal"
      - "staff"
      - "director"
      - "head of"
      - "head"
      - "vp"
      - "vice president"
      - "manager"
      - "sales"
      - "account executive"
      - "recruiter"
      - "frontend"
      - "front-end"
      - "react"
      - "angular"
      - "vue"
      - "ios"
      - "android"
      - "flutter"
      - "php"
      - "ruby"
      - "wordpress"
      - ".net"
      - "c++"
      - "embedded"
      - "intern"
      - "internship"
      - "staż"
      - "praktykant"
    keywords: []

  salary:
    min_pln: 0

scoring:
  model: "gemini/gemini-3.5-flash-lite"
  temperature: 0.0
  seed: 42
  num_retries: 3
  retry_backoff: 2.0
  max_listings_per_run: 20
  max_attempts: 3
  prompt_version: "v1.1"
  top_n_digest: 10

dedup:
  enabled: true
  only_remote: true
  similarity_threshold: 0.85
  shingle_size: 5

